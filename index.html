<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f1"><meta name="description" content="日々の支出をさっと記録。コハクと暮らしを振り返る、小さな家計簿。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="コハク家計簿"><meta name="app-version" content="0.2.0"><title>コハクと家計簿</title><link rel="icon" type="image/svg+xml" href="icons/icon.svg"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials"><link rel="stylesheet" href="releases/0.2.0/style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">暮らしの記録</p><h1>コハクと家計簿<span>🌿</span></h1></div><button id="settings" class="icon" aria-label="設定とバックアップ">⚙</button></header>
<section class="month"><button id="prev" aria-label="前の月">‹</button><h2 id="monthTitle"></h2><button id="next" aria-label="次の月">›</button><button id="today">今月</button></section>
<section class="summary"><p>今月の支出 <span id="count"></span></p><strong id="total"></strong><p class="caption">小さな記録で、暮らしを見渡す。</p></section>
<nav aria-label="表示切り替え"><button id="listTab" aria-selected="true">記録一覧</button><button id="statsTab" aria-selected="false">月の統計</button></nav><section id="content"></section>
<p class="storage-note">記録はこのブラウザに保存されます。<button id="backupLink">バックアップ</button></p><button id="add" class="add">＋ 記録する</button></main>
<dialog id="editor"><form id="entryForm"><div class="dialog-head"><h2 id="editorTitle">支出を記録</h2><button type="button" class="icon" id="closeEditor" aria-label="閉じる">×</button></div><label>金額<span class="amount-input"><span>¥</span><input id="amount" type="text" inputmode="numeric" pattern="[0-9０-９,，]*" autocomplete="off" placeholder="0" required maxlength="12"></span></label><label>日付<input id="date" type="date" required></label><fieldset><legend>分類</legend><button type="button" id="chooseCategory" aria-haspopup="dialog"><span id="chosenCategory"></span><span aria-hidden="true">›</span></button></fieldset><label>メモ <span class="optional">任意</span><input id="memo" maxlength="200" placeholder="買ったもの、お店など"></label><p id="formError" role="alert"></p><div class="actions"><button type="button" id="delete" class="danger">削除</button><button type="submit" class="primary">保存</button><button type="submit" id="continue" value="continue">続ける</button></div></form></dialog>
<dialog id="backup"><div class="dialog-head"><h2>設定とバックアップ</h2><button id="closeBackup" class="icon" aria-label="閉じる">×</button></div><p>この端末・ブラウザ専用の保存です。端末を変える前や、定期的にファイルを保存してください。</p><button id="export" class="primary wide">バックアップを書き出す</button><label class="import-label">バックアップを読み込む<input id="import" type="file" accept="application/json,.json"></label><p class="caption">読み込み時は、今ある記録を確認後に置き換えます。端末間の自動同期はありません。</p><p id="backupError" role="alert"></p><section class="update-setting"><span>現在のバージョン <strong>0.2.0</strong></span><a href="update.html?from=0.2.0">更新を確認 ›</a></section></dialog><dialog id="categoryPicker" aria-labelledby="categoryTitle"><div class="picker-head"><h2 id="categoryTitle">分類を選ぶ</h2><button type="button" id="closeCategory" aria-label="分類選択を閉じる">×</button></div><div class="picker-columns"><section aria-label="大分類" id="categories"></section><section aria-label="小分類" id="children"></section></div><p class="picker-help" id="pickerHelp" role="status"></p></dialog><div id="toast" role="status"></div><script src="releases/0.2.0/core.js"></script><script src="releases/0.2.0/app.js"></script></body></html>
