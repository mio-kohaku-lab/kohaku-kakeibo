<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f1"><meta name="description" content="日々の支出をさっと記録。コハクと暮らしを振り返る、小さな家計簿。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="コハク家計簿"><meta name="app-version" content="0.3.16"><title>コハクと家計簿</title><link rel="icon" type="image/png" sizes="32x32" href="icons/jar-final-v4-favicon.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/jar-final-v4-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/jar-final-v4-apple-touch.png"><link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials"><link rel="stylesheet" href="releases/0.3.16/style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">暮らしの記録</p><h1>コハクと家計簿<span>🌿</span></h1></div><button id="settings" class="icon" aria-label="設定とバックアップ">⚙</button></header>
<section class="month"><button id="prev" aria-label="前の月">‹</button><h2 id="monthTitle"></h2><button id="next" aria-label="次の月">›</button><button id="today">今月</button></section>
<section class="summary"><p>今月の支出 <span id="count"></span></p><strong id="total"></strong></section>
<nav aria-label="表示切り替え"><button id="listTab" aria-selected="true">記録一覧</button><button id="statsTab" aria-selected="false">月の統計</button></nav><div id="statsSwitch" class="stats-switch" role="group" aria-label="統計の表示切り替え" hidden><button id="totalsTab" aria-pressed="true" aria-controls="content">項目別合計</button><button id="chartTab" aria-pressed="false" aria-controls="content">円グラフ</button><button id="yearTab" aria-pressed="false" aria-controls="content">前年比</button></div><section id="content"></section>
<p class="storage-note">記録はこのブラウザに保存されます。<button id="backupLink">バックアップ</button></p><button id="add" class="add">＋ 記録する</button></main>
<dialog id="editor" aria-labelledby="editorTitle"><form id="entryForm">
<div class="editor-top"><div class="dialog-head"><h2 id="editorTitle">支出を記録</h2><button type="button" class="icon" id="closeEditor" aria-label="閉じる">×</button></div>
<input id="date" type="hidden"><input id="amount" type="hidden">
<button type="button" id="chooseDate" class="field-row" aria-controls="datePanel"><span>日付</span><strong id="chosenDate"></strong></button>
<button type="button" id="chooseAmount" class="field-row" aria-controls="amountPanel"><span>金額</span><strong id="chosenAmount"></strong></button>
<button type="button" id="chooseCategory" class="field-row" aria-controls="categoryPanel"><span>分類</span><strong id="chosenCategory"></strong></button>
</div>
<section id="inputDock" aria-label="入力パネル"><div class="picker-head"><h2 id="panelTitle">金額</h2><button type="button" id="closePanel" aria-label="入力パネルを閉じる">×</button></div>
<div id="amountPanel" class="input-panel"><div id="keypad"></div></div>
<div id="datePanel" class="input-panel" hidden><div class="calendar-head"><button type="button" id="calendarPrev" aria-label="前の月">‹</button><strong id="calendarMonth"></strong><button type="button" id="calendarNext" aria-label="次の月">›</button><button type="button" id="calendarToday">今日</button></div><div class="weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendarDays"></div></div>
<div id="categoryPanel" class="input-panel" hidden><div class="picker-columns"><section aria-label="大分類" id="categories"></section><section aria-label="小分類" id="children"></section></div><p class="picker-help" id="pickerHelp" role="status"></p></div>
<div id="idlePanel" class="input-panel" hidden><p>日付・金額・分類を押すと<br>ここで入力できます。</p></div></section>
<div class="editor-bottom"><p id="formError" role="alert"></p><div class="actions"><button type="button" id="delete" class="danger">削除</button><button type="submit" class="primary">保存</button><button type="submit" id="continue" value="continue">続ける</button></div></div>
</form></dialog>
<dialog id="backup"><div class="dialog-head"><h2>設定とバックアップ</h2><button id="closeBackup" class="icon" aria-label="閉じる">×</button></div><section class="install-setting"><h3>ホーム画面にインストール</h3><button id="installApp" class="primary wide" type="button">インストール</button><p id="installStatus" role="status" aria-live="polite"></p></section><p>この端末・ブラウザ専用の保存です。端末を変える前や、定期的にファイルを保存してください。</p><button id="export" class="primary wide">バックアップを書き出す</button><label class="import-label">バックアップを読み込む<input id="import" type="file" accept="application/json,.json"></label><p class="caption">読み込み時は、今ある記録を確認後に置き換えます。端末間の自動同期はありません。</p><p id="backupError" role="alert"></p><section class="update-setting"><span>現在のバージョン <strong>0.3.16</strong></span><a href="update.html?from=0.3.16">更新を確認 ›</a></section></dialog><div id="toast" role="status"></div><script src="releases/0.3.16/core.js"></script><script src="releases/0.3.16/app.js"></script></body></html>
